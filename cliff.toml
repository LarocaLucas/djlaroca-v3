# Modelo padrão de changelog (pt-BR) para os projetos do Laroca.
# Copie para a raiz do projeto como cliff.toml. Documentação: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Todas as mudanças relevantes deste projeto são registradas aqui.
O formato segue o [Keep a Changelog](https://keepachangelog.com/pt-BR/1.1.0/) e o projeto usa [Versionamento Semântico](https://semver.org/lang/pt-BR/).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%d/%m/%Y") }}
{% else %}\
## [Não lançado]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**[INCOMPATÍVEL]** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->✨ Novidades" },
  { message = "^fix", group = "<!-- 1 -->🐛 Correções" },
  { message = "^perf", group = "<!-- 2 -->⚡ Desempenho" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refatoração" },
  { message = "^docs", group = "<!-- 4 -->📝 Documentação" },
  { message = "^style", group = "<!-- 5 -->🎨 Estilo" },
  { message = "^test", group = "<!-- 6 -->✅ Testes" },
  { message = "^build", group = "<!-- 7 -->📦 Build e dependências" },
  { message = "^ci", group = "<!-- 8 -->👷 CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 9 -->🔧 Manutenção" },
  { message = "^revert", group = "<!-- 10 -->⏪ Reversões" },
]

[bump]
# feat sobe o MINOR e mudança incompatível sobe o MAJOR, mesmo na fase 0.x.
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"
